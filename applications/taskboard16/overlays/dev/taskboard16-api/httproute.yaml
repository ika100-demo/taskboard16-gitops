apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard16-api
  labels:
    app: taskboard16-api
    app.kubernetes.io/name: taskboard16-api
    app.kubernetes.io/part-of: taskboard16
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard16-api.taskboard16-dev.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard16-api
      port: 80
