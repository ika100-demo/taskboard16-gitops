apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard16-web
  labels:
    app: taskboard16-web
    app.kubernetes.io/name: taskboard16-web
    app.kubernetes.io/part-of: taskboard16
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard16-web.taskboard16-staging.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard16-web
      port: 80
